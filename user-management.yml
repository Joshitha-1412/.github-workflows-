
#!/bin/bash

# Linux User Account Management
# Create, Configure and Delete a User Account

USERNAME="student1"

echo "===================================="
echo " LINUX USER ACCOUNT MANAGEMENT"
echo "===================================="

echo "1. Creating User Account..."

if id "$USERNAME" &>/dev/null; then
    echo "User already exists!"
else
    sudo useradd -m "$USERNAME"
    sudo passwd "$USERNAME"
    echo "User created successfully!"
fi

echo ""
echo "2. Configuring User Account..."

if id "$USERNAME" &>/dev/null; then
    # Add user to sudo group (Ubuntu/Debian)
    sudo usermod -aG sudo "$USERNAME"

    # Set user description
    sudo usermod -c "Student User" "$USERNAME"

    echo "User configured successfully!"
else
    echo "User does not exist!"
    exit 1
fi

echo ""
echo "3. Verifying User Account..."

id "$USERNAME"
getent passwd "$USERNAME"

echo ""
echo "4. User Account Management Completed!"

echo ""
echo "5. Delete User Account"
echo "WARNING: This permanently deletes the user's home directory."

read -r -p "Do you want to delete $USERNAME? (yes/no): " choice

if [ "$choice" = "yes" ]; then
    sudo userdel -r "$USERNAME"
    echo "User deleted successfully!"
else
    echo "User account retained."
fi

echo ""
echo "===================================="
echo " PRACTICAL COMPLETED"
echo "===================================="
